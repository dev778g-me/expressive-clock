name: Clock Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "Checking secret..."

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 is empty!"
            exit 1
          fi

          echo "Secret exists."
          echo "Secret length: ${#KEYSTORE_BASE64}"

          mkdir -p app

          echo "$KEYSTORE_BASE64" | base64 --decode > app/keyStore.jks

          echo "Checking generated keystore..."
          ls -lah app/keyStore.jks

          echo "Checking file type..."
          file app/keyStore.jks

          echo "Checking keystore..."
          keytool -list \
            -keystore app/keyStore.jks \
            -storepass "$KEYSTORE_PASSWORD"

      - name: Build signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PclockStoreFile="app/keyStore.jks" \
            -PclockStorePassword="$KEYSTORE_PASSWORD" \
            -PclockKeyAlias="$KEY_ALIAS" \
            -PclockKeyPassword="$KEY_PASSWORD"

      - name: Build signed AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease \
            -PclockStoreFile="app/keyStore.jks" \
            -PclockStorePassword="$KEYSTORE_PASSWORD" \
            -PclockKeyAlias="$KEY_ALIAS" \
            -PclockKeyPassword="$KEY_PASSWORD"

      - name: Rename artifacts
        run: |
          mkdir -p release

          cp app/build/outputs/apk/release/*.apk \
            release/Expressive_clock-${GITHUB_REF_NAME}.apk

          cp app/build/outputs/bundle/release/*.aab \
            release/Expressive_clock-${GITHUB_REF_NAME}.aab

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            release/Expressive_clock-${{ github.ref_name }}.apk
            release/Expressive_clock-${{ github.ref_name }}.aab